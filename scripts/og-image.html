<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
 @font-face{font-family:InterVariable;src:url('../public/fonts/InterVariable.woff2') format('woff2');font-weight:100 900}
 html,body{margin:0}
 body{width:1200px;height:630px;position:relative;overflow:hidden;background:#0f1720;color:#eef3f7;font-family:InterVariable,sans-serif;font-feature-settings:'cv02','cv03','cv04','cv11'}
 img{position:absolute;inset:0 0 0 40%;width:60%;height:100%;object-fit:cover;object-position:57% center;filter:brightness(.7) saturate(.75)}
 .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0f1720 40%,#0f172099 52%,transparent 76%)}
 .content{position:relative;padding:0 72px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px}
 h1{margin:0;font-size:168px;font-weight:900;line-height:.86;letter-spacing:-.055em}
 h1 span{display:block;color:#b9ddf2}
 p{margin:0;font-size:36px;font-weight:600;letter-spacing:-.02em}
 small{color:#9aa9b7;font-size:22px;font-weight:500}
</style>
</head>
<body>
 <img src="../images/utah-edmonton-delta-center.jpg" alt=""/>
 <div class="shade"></div>
 <div class="content"><h1>HOCKEY<span>101.</span></h1><p>A spectator’s field guide</p><small>hockey.michaelbonner.dev</small></div>
</body>
</html>
